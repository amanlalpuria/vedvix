<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vedvix | Product Studio</title>
    <script>
      // Defensive script to handle cases where external scripts try to overwrite window.fetch
      // which is a read-only property in some sandboxed environments.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch && Object.getOwnPropertyDescriptor(window, 'fetch')?.set === undefined) {
             // It's already getter-only, we just need to make sure we don't try to set it.
             // If some script does window.fetch = ..., it will throw.
             // We can catch those early by defining a no-op setter if configurable.
             if (Object.getOwnPropertyDescriptor(window, 'fetch')?.configurable) {
                Object.defineProperty(window, 'fetch', {
                  get: function() { return originalFetch; },
                  set: function() { console.warn('Blocked attempt to overwrite window.fetch'); },
                  configurable: true
                });
             }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
